name: Build desktop apps

# Packages the desktop app for macOS, Windows and Linux, each on its own system. Started by
# hand from the Actions tab; the installers are kept with the run as artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:pack
      - uses: actions/upload-artifact@v7
        with:
          name: pulsr-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
